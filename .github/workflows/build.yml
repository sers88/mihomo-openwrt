name: Build Mihomo.apk

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */12 * * *'

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_generic, x86_64]

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6

      - name: Get latest mihomo version
        run: |
          TAG=$(curl -s "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | jq -r '.tag_name' | tr -d 'v')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to resolve latest mihomo release" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Get latest metacubexd version and hash
        run: |
          RESP=$(curl -s "https://api.github.com/repos/MetaCubeX/metacubexd/releases/latest")
          XD_TAG=$(echo "$RESP" | jq -r '.tag_name' | tr -d 'v')
          XD_HASH=$(echo "$RESP" | jq -r '.assets[] | select(.name == "compressed-dist.tgz") | .digest' | sed 's/^sha256://')
          if [ -z "$XD_TAG" ] || [ "$XD_TAG" = "null" ] || [ -z "$XD_HASH" ] || [ "$XD_HASH" = "null" ]; then
            echo "Failed to resolve metacubexd release info" >&2
            exit 1
          fi
          echo "XD_TAG=$XD_TAG" >> $GITHUB_ENV
          echo "XD_HASH=$XD_HASH" >> $GITHUB_ENV

      - name: Check if build already exists for this arch
        id: check_existing
        run: |
          ASSETS="$(gh release view "v${{ env.TAG }}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if echo "$ASSETS" | grep -q "^mihomo-[0-9.]*-r[0-9]*_${{ matrix.arch }}.apk$" \
             && echo "$ASSETS" | grep -q "^mihomo-metacubexd-[0-9.]*-r[0-9]*_${{ matrix.arch }}.apk$" \
             && echo "$ASSETS" | grep -q "^luci-app-mihomo-[0-9.]*-r[0-9]*_${{ matrix.arch }}.apk$"; then
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
            echo "Skipping build - release v${{ env.TAG }} already contains all three APKs for ${{ matrix.arch }}"
          else
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps
        if: env.SKIP_BUILD != 'true'
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget jq

      - name: Generate build keys
        if: env.SKIP_BUILD != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y signify-openbsd
          signify-openbsd -G -n -c 'DO NOT USE - OpenWrt packages feed CI' -p packages_ci.pub -s packages_ci.sec
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "KEY_BUILD<<$EOF" >> $GITHUB_ENV
          cat packages_ci.sec >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Setup latest golang release
        if: env.SKIP_BUILD != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: Show go version
        if: env.SKIP_BUILD != 'true'
        run: |
          go version

      - name: Build
        if: env.SKIP_BUILD != 'true'
        run: |
          case "${{ matrix.arch }}" in
            aarch64_generic)
              TARGET_URL="https://downloads.openwrt.org/releases/25.12.2/targets/rockchip/armv8/"
              ;;
            x86_64)
              TARGET_URL="https://downloads.openwrt.org/releases/25.12.2/targets/x86/64/"
              ;;
          esac

          SDK=$(curl -s -L "${TARGET_URL}sha256sums" | grep sdk | sed 's/.* \*//')
          wget "${TARGET_URL}${SDK}" -O sdk.tar.xz

          mkdir sdk
          tar -I zstd -xf sdk.tar.xz --strip-components=1 -C sdk
          cd sdk
          ./scripts/feeds update -a
          wget "${TARGET_URL}config.buildinfo" -O .config
          make defconfig
          cp -a ../net package/
          sed -i 's/PKG_VERSION:=stable/PKG_VERSION:=${{ env.TAG }}/g' package/net/mihomo/Makefile
          cat package/net/mihomo/Makefile
          sed -i "s/PKG_VERSION:=stable/PKG_VERSION:=${{ env.XD_TAG }}/g" package/net/mihomo-metacubexd/Makefile
          sed -i "s/PKG_HASH:=skip/PKG_HASH:=${{ env.XD_HASH }}/g" package/net/mihomo-metacubexd/Makefile
          cat package/net/mihomo-metacubexd/Makefile
          sed -i 's/PKG_VERSION:=stable/PKG_VERSION:=${{ env.TAG }}/g' package/net/luci-app-mihomo/Makefile
          cat package/net/luci-app-mihomo/Makefile
          make package/net/mihomo/{download,check} FIXUP=1 V=s
          make package/net/mihomo-metacubexd/{download,check} FIXUP=1 V=s
          make package/net/mihomo/compile V=s
          make package/net/mihomo-metacubexd/compile V=s
          make package/net/luci-app-mihomo/compile V=s

          find bin/packages -name '*.apk' -exec sh -c 'mv "$1" "${1%.apk}_${{ matrix.arch }}.apk"' _ {} \;
          echo "PKG_NAME=mihomo-openwrt-${{ env.TAG }}-${{ matrix.arch }}" >> $GITHUB_ENV
          cd -

      - name: Publishing to GitHub Artifacts
        if: env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            sdk/bin/packages/*/*/mihomo*.apk
            sdk/bin/packages/*/*/luci-app-mihomo*.apk
      - name: Read release.md and use it as a body of new release
        if: env.SKIP_BUILD != 'true'
        id: read_release
        shell: bash
        run: |
          r=$(cat README.md)
          r="${r//'%'/'%25'}"
          r="${r//$'\n'/'%0A'}"
          r="${r//$'\r'/'%0D'}"
          echo "RELEASE_BODY=$r" >> $GITHUB_OUTPUT

      - name: Publishing to GitHub Releases
        if: env.SKIP_BUILD != 'true'
        continue-on-error: true
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: sdk/bin/packages/*/*/*.apk
          tag: v${{ env.TAG }}
          release_name: v${{ env.TAG }}
          file_glob: true
          overwrite: true
          body: |
            ${{ steps.read_release.outputs.RELEASE_BODY }}

  feed:
    name: Publish APK feed to Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve latest mihomo version
        run: |
          TAG=$(curl -s "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | jq -r '.tag_name' | tr -d 'v')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to resolve latest mihomo release" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
        continue-on-error: true

      - name: Assemble feed site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p site/keys site/packages/aarch64_generic site/packages/x86_64
          cp keys/mihomo-openwrt.pem site/keys/

          for arch in aarch64_generic x86_64; do
            found=0
            for f in $(find artifacts -type f -name "*_${arch}.apk" 2>/dev/null); do
              found=1
              base=$(basename "$f" "_${arch}.apk")
              cp "$f" "site/packages/$arch/${base}.apk"
            done
            if [ "$found" -eq 0 ]; then
              echo "No build artifact for $arch, falling back to release v${TAG}"
              mkdir -p "tmp-rel-${arch}"
              gh release download "v${TAG}" --pattern "*_${arch}.apk" --dir "tmp-rel-${arch}"
              for f in "tmp-rel-${arch}"/*.apk; do
                base=$(basename "$f" "_${arch}.apk")
                cp "$f" "site/packages/$arch/${base}.apk"
              done
            fi
            ls -la "site/packages/$arch"
          done

      - name: Install apk-tools
        run: |
          curl -fsSL -o apk.static https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v3.0.7/x86_64/apk.static
          echo "c07bf5356eacc9dd7a8c56bc537f46702f007170287403299d52a04264e74b3c  apk.static" | sha256sum -c -
          chmod +x apk.static

      - name: Verify signing key against committed public key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -eu
          printf '%s\n' "$APK_SIGNING_KEY" > private-key.pem
          openssl ec -in private-key.pem -pubout -out derived-key.pem
          diff -u keys/mihomo-openwrt.pem derived-key.pem

      - name: Generate and sign repository indexes
        run: |
          set -eu
          for arch in aarch64_generic x86_64; do
            (cd "site/packages/$arch" &&
              "$GITHUB_WORKSPACE/apk.static" mkndx \
                --allow-untrusted \
                --sign "$GITHUB_WORKSPACE/private-key.pem" \
                --output packages.adb *.apk)
          done
          rm -f private-key.pem

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  feed-test:
    name: Test feed install (x86_64)
    needs: feed
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify feed files are served
        run: |
          set -eu
          BASE=https://sers88.github.io/mihomo-openwrt
          code=
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/packages/x86_64/packages.adb" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "packages.adb not reachable (last code: $code)" >&2
            exit 1
          fi
          curl -fsSL -o /dev/null "$BASE/packages/aarch64_generic/packages.adb"
          curl -fsSL -o /dev/null "$BASE/keys/mihomo-openwrt.pem"

      - name: Install from feed in OpenWrt container
        run: |
          docker run --rm -v "$PWD/keys:/hostkeys:ro" openwrt/rootfs:x86_64-25.12.2 sh -exc '
            cp /hostkeys/mihomo-openwrt.pem /etc/apk/keys/
            echo "https://sers88.github.io/mihomo-openwrt/packages/x86_64/packages.adb" >> /etc/apk/repositories.d/customfeeds.list
            apk update
            apk add mihomo mihomo-metacubexd luci-app-mihomo
            mihomo -v | head -n 2
            test -f /usr/share/mihomo/ui/index.html
            test -f /usr/share/luci/menu.d/luci-app-mihomo.json
            test -f /usr/share/luci/acl.d/luci-app-mihomo.json
            test -f /www/luci-static/resources/view/mihomo.js
            echo FEED-TEST-OK
          '

  cleanup:
    name: Keep only 2 latest releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Delete old releases
        run: |
          gh release list --limit 100 --json tagName | jq -r '.[2:][].tagName' | xargs -r -I % gh release delete % --yes --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
